name: Welcome New Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome! Thanks for opening your first issue in the Landlord Framework. A maintainer will take a look soon.

            In the meantime, please make sure you've filled out the issue template completely.
          pr-message: |
            Welcome! Thanks for your first pull request to the Landlord Framework!

            A maintainer will review it shortly. Please make sure:
            - All CI checks pass
            - The PR template is filled out
            - Tests are included for new functionality
