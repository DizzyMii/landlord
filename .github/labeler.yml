# Configuration for actions/labeler
# Automatically labels PRs based on changed file paths

documentation:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "**/*.md", "!.github/**/*.md"]

ci:
  - changed-files:
      - any-glob-to-any-file: [".github/workflows/**", ".github/*.yml"]

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - "yarn.lock"
          - "pnpm-lock.yaml"
          - "Gemfile*"
          - "requirements*.txt"
          - "Cargo.toml"
          - "go.mod"
          - "go.sum"

