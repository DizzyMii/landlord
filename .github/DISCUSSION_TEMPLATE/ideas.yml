title: "[Idea]: "
labels:
  - idea
body:
  - type: markdown
    attributes:
      value: |
        Share your idea with the community! Describe what you'd like to see and why.

  - type: textarea
    id: idea
    attributes:
      label: Describe your idea
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this idea valuable? What use case does it address?
    validations:
      required: false
