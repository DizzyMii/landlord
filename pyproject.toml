[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "landlord-framework"
version = "0.1.0"
description = "An agentic AI framework with contract-based orchestration"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[project.scripts]
landlord = "landlord.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["landlord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
