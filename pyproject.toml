[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "landlord-framework"
version = "0.2.0"
description = "An agentic AI framework with contract-based orchestration, exposed as an MCP server."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "claude-agent-sdk>=0.1",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]
legacy = [
    "litellm>=1.40",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
landlord-mcp = "landlord.mcp_server:main"
landlord-watch = "landlord.watch:main"
landlord = "landlord.legacy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["landlord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/legacy"]

[tool.ruff]
target-version = "py311"
line-length = 100
